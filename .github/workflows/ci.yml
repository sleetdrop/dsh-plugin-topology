name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `dorny/paths-filter` lists changed files via the GitHub REST API on
# `pull_request` runs, so it needs `pull-requests: read` in addition to the code
# checkout (`contents: read`). Without it change detection fails outright.
permissions:
  contents: read
  pull-requests: read

# The `quality` job must always exist for both matrix nodes: `main` branch
# protection lists "quality (node 22)" and "quality (node 24)" as required
# status checks. Skipping the whole job for docs-only PRs (`paths-ignore`)
# would leave those two contexts absent and the PR stuck on "Expected — waiting
# for status". So the job is never removed; a path filter inside it only decides
# how much of its own steps to run.
#
# The filter is a DOC BLACKLIST: `nonDocs` matches every changed file that is
# not documentation, and it is written as "all paths, minus the doc patterns".
# Only the doc patterns (`README.md`, `**/*.md`, `docs/**`) are maintained, so a
# file type we have never seen before — a new top-level config, a new directory
# — automatically counts as a non-doc change and gets the full pipeline. A
# whitelist of code paths would silently under-check such a file.
#
# Two details make this work:
#   * `predicate-quantifier: 'some-with-excludes'` (requires paths-filter
#     v4.0.3+) is what lets a single filter express "matches `**` but none of
#     the negated doc patterns".
#   * `dot: true` inside the action means `**` also matches `.github/**` and
#     `.gitignore`, so workflow edits are never mistaken for docs.
#
# The `any` filter exists only to catch "no changed files were detected" (a
# `workflow_dispatch` run with nothing to diff, for example). Zero changes must
# fall through to the full pipeline instead of silently taking the light path.
jobs:
  quality:
    name: quality (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - name: Detect scope of changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            any:
              - '**'
            nonDocs:
              - '**'
              - '!README.md'
              - '!**/*.md'
              - '!docs/**'
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Pure README/docs change: install (a no-op from the pnpm cache), verify
      # the compatibility sync — the one gate a doc edit can desync — and stop.
      # Markdown cannot affect the compiled artifact.
      - name: Docs-only — verify compatibility sync
        if: steps.filter.outputs.nonDocs == 'false' && steps.filter.outputs.any_count != '0'
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:compat
      # Exact complement of the step above: any non-doc file changed, or no
      # changes detected at all. This includes a README+source PR, a lockfile
      # bump, and every edit to this workflow.
      - name: Install and full check
        if: steps.filter.outputs.nonDocs != 'false' || steps.filter.outputs.any_count == '0'
        run: |
          pnpm install --frozen-lockfile
          pnpm check