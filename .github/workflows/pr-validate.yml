name: PR validate

# `quality` proves the checkout compiles and its units pass; it never starts a
# host. This job assembles the published DSH release the checkout declares in
# `engines.dsh`, installs the built plugin into it, boots its headless web
# server, and probes the sidebar and page in a real Chrome. That is the layer
# where a bundle silently skipped by the compatibility gate, a client bundle
# that throws on load, or a page that renders blank becomes visible before
# merge — the failure class a user reports as "the panel is gone".
#
# Scope follows ci.yml's doc-blacklist: a docs-only PR skips the heavy steps but
# the job still succeeds, so this context can be required without wedging
# documentation PRs. Arbitrary releases are still validated on demand through
# validate-dsh.yml (the pre-release evidence run).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: validate (real DSH + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect scope of changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            any:
              - '**'
            nonDocs:
              - '**'
              - '!README.md'
              - '!**/*.md'
              - '!docs/**'
      # One condition, repeated: run unless this is a PR whose files are all
      # documentation (and something did change). A dispatch has no filter
      # outputs, so the comparison falls through to "run".
      - uses: pnpm/action-setup@v6.1.0
        if: steps.filter.outputs.nonDocs != 'false' || steps.filter.outputs.any_count == '0'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.nonDocs != 'false' || steps.filter.outputs.any_count == '0'
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        if: steps.filter.outputs.nonDocs != 'false' || steps.filter.outputs.any_count == '0'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.filter.outputs.nonDocs != 'false' || steps.filter.outputs.any_count == '0'
        run: pnpm build
      # The declared lower bound is the line this checkout claims to support,
      # and it is the only version a PR is validated against. `check-compat`
      # enforces that the bound is the `>=<target> <next-patch>-0` line shape.
      - name: Read the declared DSH line
        id: dsh
        if: steps.filter.outputs.nonDocs != 'false' || steps.filter.outputs.any_count == '0'
        run: |
          version="$(node -p 'const bound = require("./package.json").engines?.dsh ?? ""; const match = /^>=([^\s]+)/.exec(bound); match ? match[1] : ""')"
          if [ -z "$version" ]; then
            echo "::error::package.json engines.dsh has no lower bound to validate against"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "validating against DSH $version"
      # Only the chrome shell (~120 MB download) is cached; the sandbox's DSH
      # install is quick enough to repeat and its pnpm store would dwarf this.
      - name: Cache the chrome shell
        if: steps.filter.outputs.nonDocs != 'false' || steps.filter.outputs.any_count == '0'
        uses: actions/cache@v6
        with:
          path: ~/.cache/dsh-validate/chrome
          key: dsh-chrome-${{ runner.os }}-${{ hashFiles('scripts/validate-dsh.mjs') }}
      - name: Validate on DSH ${{ steps.dsh.outputs.version }}
        if: steps.filter.outputs.nonDocs != 'false' || steps.filter.outputs.any_count == '0'
        run: node scripts/validate-dsh.mjs --dsh "${{ steps.dsh.outputs.version }}" --plugin .
      # The harness screenshots the probe page before a stage-2 failure; the
      # step log alone rarely explains a page that rendered blank.
      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-validate-failure
          path: ~/.cache/dsh-validate/failure.png
          if-no-files-found: ignore
      - name: Docs-only — browser validation skipped
        if: steps.filter.outputs.nonDocs == 'false' && steps.filter.outputs.any_count != '0'
        run: echo "documentation-only change; the DSH sandbox probe is not needed"
