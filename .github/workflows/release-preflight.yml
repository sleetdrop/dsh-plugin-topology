name: Release preflight

# Manual pre-tag run. It never publishes and never tags; it produces the exact
# tarball for human inspection, alongside the full quality gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack --pack-destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-plugin-topology-package
          path: dist/*.tgz
          if-no-files-found: error
