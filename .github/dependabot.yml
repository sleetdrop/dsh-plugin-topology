version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # DSH is upgraded as one coordinated step, not package by package: the
      # peer set is pinned to one rc line and the compatibility table in
      # README.md must move with it (docs/DSH-UPGRADE.md). Per-package PRs
      # would cut the rc line in half. Listing the version levels keeps this to
      # *version* updates only: `update-types` does not filter security
      # updates, so a vulnerable DSH peer still opens a PR.
      - dependency-name: "@deepseek-ai/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # The plugin ships no react. The panel runs against the react supplied by
      # the DSH shell's frozen module table, so its major has to move together
      # with the host, not ahead of it.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      # CI tests Node 22 and 24 (ci.yml); types must not outrun the highest
      # tested major, or they typecheck APIs the tested runtimes do not have.
      # `engines` still allows newer Node for consumers — that is not CI
      # coverage, so 26 is deliberately not taken.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
